version: 2

sources:
  - name: jaffle_shop
    description: A replica of postgres db
    database: raw  
    schema: jaffle_shop  
    tables:
      - name: orders
        identifier: orders
        loaded_at_field: _etl_loaded_at
        freshness: 
          warn_after:
            count: 12
            period: hour
          error_after:
            period: hour
            count: 24
        
      - name: customers
        identifier: customers
        description: one record per customer
        columns:
          - name: id #column name is id in the source table : raw.jaffle_shop.customers
            data_tests:
              - not_null
              - unique
        
