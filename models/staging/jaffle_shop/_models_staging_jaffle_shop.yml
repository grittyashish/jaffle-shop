models:
  - name: stg_jaffle_shop__orders
    description: descriptoin
    columns:
      - name: status
        data_tests:
          - accepted_values:
              values: ['placed', 'shipped', 'completed', 'returned', 'return_pending']
          - not_null
      - name: order_id
        description: "{{doc('order_status')}}"
        data_tests:
          - unique
          - not_null
  - name: customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
